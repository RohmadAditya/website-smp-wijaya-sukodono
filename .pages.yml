media:
  input: public/images/uploads
  output: /images/uploads
content:
  - name: berita
    label: Berita & Pengumuman
    type: collection
    path: src/content/berita
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, kategori, tanggal, draft]
      default: { sort: tanggal, order: desc }
    fields:
      - { name: title, label: Judul Berita, type: string, required: true }
      - { name: tanggal, label: Tanggal Publikasi, type: date, required: true }
      - name: kategori
        label: Kategori
        type: select
        required: true
        options: { values: [Kegiatan, Prestasi, Pengumuman, Akademik] }
      - { name: thumbnail, label: Foto Sampul (Landscape, maks 1 MB), type: image }
      - { name: ringkasan, label: Ringkasan Singkat (1-2 kalimat), type: text, required: true }
      - { name: draft, label: Simpan sebagai Draft, type: boolean, default: false }
      - { name: body, label: Isi Berita, type: rich-text }
  - name: pengaturan
    label: Pengaturan Sekolah & Beranda
    type: file
    path: src/content/data/pengaturan.json
    fields:
      - { name: nama_sekolah, label: Nama Resmi Sekolah, type: string, required: true }
      - { name: npsn, label: NPSN, type: string }
      - { name: akreditasi, label: Akreditasi, type: string }
      - name: sambutan_kepsek
        label: Sambutan Kepala Sekolah
        type: object
        fields:
          - { name: nama, label: Nama Kepala Sekolah, type: string }
          - { name: foto, label: Foto Kepala Sekolah, type: image }
          - { name: pesan, label: Isi Sambutan Singkat, type: text }
      - { name: ppdb_aktif, label: Tampilkan Banner SPMB di Beranda?, type: boolean, default: false }
      - { name: ppdb_link, label: Link Formulir SPMB (Google Forms), type: string }
      - name: kontak
        label: Informasi Kontak Resmi
        type: object
        fields:
          - { name: alamat, label: Alamat Lengkap, type: text }
          - { name: telepon, label: Telepon Sekolah, type: string }
          - { name: whatsapp, label: Nomor WA TU (62812xxx), type: string }
          - { name: email, label: Email Resmi Sekolah, type: string }
          - { name: instagram, label: Link Instagram Sekolah, type: string }
  - name: fasilitas
    label: Fasilitas Sekolah
    type: file
    path: src/content/data/fasilitas.json
    fields:
      - name: daftar
        label: Daftar Fasilitas
        type: object
        list: true
        fields:
          - { name: id, label: ID Unik, type: number, required: true }
          - { name: nama, label: Nama Fasilitas, type: string, required: true }
          - name: kategori
            label: Kategori
            type: select
            options: { values: [Akademik, Laboratorium, Olahraga & Ibadah] }
          - { name: deskripsi, label: Deskripsi Singkat, type: text }
          - { name: foto, label: Foto Sampul Utama (4:3, maks 1 MB), type: image }
          - name: galeri
            label: Foto Tambahan / Galeri (Bisa lebih dari 1 foto)
            type: image
            list: true
  - name: guru
    label: Direktori Guru & Staf
    type: file
    path: src/content/data/guru.json
    fields:
      - name: daftar
        label: Daftar Tenaga Pendidik & Kependidikan
        type: object
        list: true
        fields:
          - { name: nama, label: Nama Lengkap & Gelar, type: string, required: true }
          - { name: jabatan, label: Jabatan / Mata Pelajaran, type: string, required: true }
          - name: bidang
            label: Kelompok
            type: select
            options: { values: [Pimpinan, Guru Mapel, Staf TU] }
          - { name: inisial, label: Inisial Avatar (2 Huruf), type: string }
          - { name: foto, label: Foto Profil, type: image }
  - name: profil
    label: Halaman Profil Sekolah
    type: file
    path: src/content/data/profil.md
    fields:
      - { name: title, label: Judul Halaman, type: string }
      - { name: visi, label: Visi Sekolah, type: text }
      - { name: misi, label: Daftar Misi, type: string, list: true }
      - { name: body, label: Sejarah & Profil Lengkap, type: rich-text }
  - name: ppdb
    label: Halaman Informasi SPMB
    type: file
    path: src/content/data/ppdb.md
    fields:
      - { name: title, label: Judul Halaman SPMB, type: string }
      - { name: tahun_ajaran, label: Tahun Ajaran, type: string }
      - { name: body, label: Syarat, Jadwal & Alur Pendaftaran, type: rich-text }
